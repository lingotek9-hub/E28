overview:{t:'شنو يعني هندسة صناعية؟',p:'هنا المقصود بالمسار الصناعي داخل هندسة الإلكترونيات، وليس تخصص الهندسة الصناعية الإداري التقليدي. يركز التخصص على الأتمتة الصناعية (Industrial Automation)، نظم التحكم (Control Systems)، المتحكمات المنطقية القابلة للبرمجة (PLC)، الحساسات والمشغلات (Sensors & Actuators)، المحركات الكهربائية، القياسات وأجهزة المعايرة (Instrumentation)، الروبوتات الصناعية، والاتصالات الصناعية مثل SCADA وHMI وشبكات المصانع الذكية. الهدف الأساسي هو تحويل الآلات والمعدات المعزولة إلى منظومة إنتاجية مؤتمتة، ذكية، فائقة الدقة والأمان، تتحكم في تدفق المواد والعمليات وتراقب الأداء لحظيًا.',flow:[['استشعار','SENSOR'],['إدخال','INPUT'],['تحكّم','PLC'],['منطق','LOGIC'],['إخراج','OUTPUT'],['مُشغّل','ACTUATOR'],['ماكينة','MACHINE'],['بيانات','DATA'],['تحسين','OPTIMIZE']],facts:[['FIELD','Industrial Engineering (Automation & Control)'],['FOCUS','Automation • Control • PLC • Robotics • Industrial Systems'],['WORK STYLE','Technical • Practical • Analytical • Field + Control Room'],['CAREER DOMAINS','Automation • Control • Manufacturing • Industrial Systems • Instrumentation']]},
